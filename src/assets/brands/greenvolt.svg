<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 85" fill="none">
  <!-- Leaf & Voltage Bolt Icon -->
  <g transform="translate(10, 10)">
    <circle cx="32" cy="32" r="30" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
    <!-- Leaf outline -->
    <path d="M 20 44 C 18 26, 30 16, 44 14 C 44 28, 38 42, 20 44 Z" fill="#10B981" />
    <!-- Lightning Bolt overlay -->
    <path d="M 36 18 L 26 31 L 32 31 L 28 42 L 40 28 L 34 28 Z" fill="#FACC15" />
  </g>

  <!-- GreenVolt Wordmark -->
  <text x="82" y="47" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="900" fill="#047857" letter-spacing="-0.5">
    Green<tspan fill="#0284C7">Volt</tspan>
  </text>
  
  <!-- Subtext: POWER INDIA -->
  <text x="84" y="66" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A" letter-spacing="3">
    POWER INDIA
  </text>
  <line x1="84" y1="72" x2="230" y2="72" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
</svg>
