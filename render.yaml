services:
  # 1. Frontend Web Service (TanStack Start / Nitro Node Server)
  - type: web
    name: omsun-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_API_URL
        fromService:
          type: web
          name: omsun-api
          property: host

  # 2. Backend API Service (Express.js)
  - type: web
    name: omsun-api
    runtime: node
    plan: free
    rootDir: server-api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 4000
